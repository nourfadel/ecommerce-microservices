spring:
  application:
    name: order-service

  #  Databases

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  #  JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  #  FLYWAY
  flyway:
    enabled: false

server:
  port: 8082

#  Eureka Server
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/